<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 쓰기 - My REST App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="nav">
        <div class="nav-brand">My REST App</div>
        <div class="nav-links">
            <a href="/index.html" class="nav-link">홈</a>
            <a href="/posts.html" class="nav-link active">게시글</a>
            <a href="/profile.html" class="nav-link">프로필</a>
            <a href="#" id="logoutBtn" class="nav-link">로그아웃</a>
        </div>
    </nav>

    <main class="container">
        <div class="card" style="max-width: none;">
            <h1 id="formTitle">새 글 작성</h1>
            <p id="formSubtitle" class="muted">나만의 소중한 이야기를 들려주세요.</p>

            <form id="postForm">
                <div class="form-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" placeholder="제목을 입력하세요" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="tags">태그</label>
                    <input type="text" id="tags" placeholder="태그를 쉼표(,)로 구분하여 입력하세요 (예: 맛집, 일상)">
                </div>
                <div class="form-group">
                    <label for="content">내용</label>
                    <textarea id="contentField"
                        style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1rem; color: var(--text-main); font-size: 1rem; min-height: 300px; outline: none;"
                        placeholder="내용을 입력하세요" required></textarea>
                </div>

                <div style="margin-top: 2.5rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">저장하기</button>
                    <button type="button" class="btn" onclick="history.back()"
                        style="background: var(--card-bg);">취소</button>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/posts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 인증 체크
            if (!api.getTokens().access) {
                location.href = '/login.html';
                return;
            }

            const params = new URLSearchParams(location.search);
            const postNo = params.get('no');

            // 로그아웃 연동
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                api.clearAndRedirect();
            });

            // 수정 모드인 경우 데이터 로드
            if (postNo) {
                document.getElementById('formTitle').innerText = '글 수정하기';
                document.getElementById('formSubtitle').innerText = '기존의 내용을 멋지게 수정해보세요.';

                const post = await posts.fetchDetail(postNo);
                if (post) {
                    document.getElementById('title').value = post.title;
                    document.getElementById('tags').value = post.tags || '';
                    document.getElementById('contentField').value = post.content || '';
                } else {
                    alert('게시글 정보를 불러올 수 없습니다.');
                    history.back();
                }
            }

            // 폼 제출 처리
            document.getElementById('postForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const postData = {
                    title: document.getElementById('title').value,
                    content: document.getElementById('contentField').value,
                    tags: document.getElementById('tags').value
                };

                const success = await posts.save(postData, postNo);
                if (success) {
                    alert('성공적으로 저장되었습니다.');
                    location.href = postNo ? `/post_detail.html?no=${postNo}` : '/posts.html';
                }
            });
        });
    </script>
</body>

</html>
