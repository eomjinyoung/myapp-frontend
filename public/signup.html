<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - My REST App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="card">
            <h1>회원가입</h1>
            <p class="muted">새로운 계정을 생성하고 시작해보세요.</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="name">이름 (실명)</label>
                    <input type="text" id="name" placeholder="홍길동" required>
                </div>
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="8자 이상 입력" required>
                </div>
                <div class="form-group">
                    <label for="passwordConfirm">비밀번호 확인</label>
                    <input type="password" id="passwordConfirm" placeholder="비밀번호 다시 입력" required>
                </div>

                <button type="submit" class="btn btn-primary">가입하기</button>
            </form>

            <a href="/login.html" class="btn btn-link">이미 계정이 있으신가요? 로그인</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', auth.handleSignup);
    </script>
</body>

</html>
