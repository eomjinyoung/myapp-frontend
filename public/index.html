<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - My REST App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="nav">
        <div class="nav-brand">My REST App</div>
        <div class="nav-links">
            <a href="/index.html" class="nav-link active">홈</a>
            <a href="/posts.html" class="nav-link">게시글</a>
            <a href="/profile.html" class="nav-link">프로필</a>
            <a href="#" id="logoutBtn" class="nav-link">로그아웃</a>
        </div>
    </nav>

    <main class="container">
        <div class="card mb-4" style="max-width: 100%;">
            <h1>환영합니다!</h1>
            <p id="welcomeMsg">사용자 정보를 불러오는 중...</p>
        </div>

        <div class="dashboard-grid"
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
            <div class="card">
                <h3>새 게시글 작성</h3>
                <p class="muted">오늘의 생각을 공유해보세요.</p>
                <button class="btn btn-primary" onclick="location.href='/post_form.html'">작성하기</button>
            </div>
            <div class="card">
                <h3>최근 게시글</h3>
                <p class="muted">다른 사용자들의 최신 글을 확인하세요.</p>
                <button class="btn btn-primary" onclick="location.href='/posts.html'">보러가기</button>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        // 페이지 로드 시 인증 체크 및 사용자 정보 로드
        document.addEventListener('DOMContentLoaded', async () => {
            const { access } = api.getTokens();
            if (!access) {
                location.href = '/login.html';
                return;
            }

            try {
                // 백엔드 엔드포인트에 맞춰 수정 (/me -> /api/user/me)
                const response = await api.request('/api/user/me');
                if (response && response.ok) {
                    const data = await response.json();
                    document.getElementById('welcomeMsg').innerText = `${data.name || data.username}님, 프로젝트 관리를 시작해볼까요?`;
                } else {
                    document.getElementById('welcomeMsg').innerText = '사용자 정보를 가져올 수 없습니다.';
                }
            } catch (err) {
                console.warn('Profile fetch failed:', err);
                document.getElementById('welcomeMsg').innerText = '연결 상태를 확인해주세요.';
            }
        });

        // 로그아웃 처리
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            api.clearAndRedirect();
        });
    </script>
</body>

</html>
