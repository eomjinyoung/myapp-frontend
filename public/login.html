<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - My REST App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="card">
            <h1>로그인</h1>
            <p class="muted">서비스 이용을 위해 계정에 접속하세요.</p>

            <div id="loginError" class="error-box"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary">로그인</button>
            </form>

            <a href="/signup.html" class="btn btn-link">계정이 없으신가요? 회원가입</a>
        </div>
    </div>

    <!-- API 및 인증 스크립트 로드 -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', auth.handleLogin);
    </script>
</body>

</html>
