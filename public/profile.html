<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 - My REST App</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-info {
            margin-top: 2rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-main);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="nav-brand">My REST App</div>
        <div class="nav-links">
            <a href="/index.html" class="nav-link">홈</a>
            <a href="/posts.html" class="nav-link">게시글</a>
            <a href="/profile.html" class="nav-link active">프로필</a>
            <a href="#" id="logoutBtn" class="nav-link">로그아웃</a>
        </div>
    </nav>

    <main class="container">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h1>내 프로필</h1>
            <p class="muted">계정 정보를 확인하고 관리하세요.</p>

            <div id="loading" class="text-center" style="padding: 3rem;">
                <p>정보를 불러오는 중...</p>
            </div>

            <div id="profileContent" class="profile-info" style="display: none;">
                <div class="info-row">
                    <span class="info-label">사용자 이름</span>
                    <span id="userName" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">이메일 계정</span>
                    <span id="userEmail" class="info-value">-</span>
                </div>
                <!-- 추가 정보가 있다면 여기에 구현 -->

                <div style="margin-top: 3rem; display: flex; gap: 1rem;">
                    <a href="/index.html" class="btn" style="background: var(--card-bg); text-align: center;">홈으로</a>
                    <button id="logoutBtnProfile" class="btn btn-primary">로그아웃</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 인증 체크
            if (!api.getTokens().access) {
                location.href = '/login.html';
                return;
            }

            // 로그아웃 연동
            const logout = (e) => {
                e.preventDefault();
                api.clearAndRedirect();
            };
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('logoutBtnProfile').addEventListener('click', logout);

            try {
                const response = await api.request('/api/user/me');
                if (response && response.ok) {
                    const data = await response.json();
                    document.getElementById('userName').innerText = data.name || data.username || '이름 없음';
                    document.getElementById('userEmail').innerText = data.email || '이메일 없음';

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('profileContent').style.display = 'block';
                } else {
                    alert('프로필 정보를 불러오지 못했습니다.');
                    api.clearAndRedirect();
                }
            } catch (err) {
                console.error('Profile fetch error:', err);
                alert('서버와 통신 중 오류가 발생했습니다.');
            }
        });
    </script>
</body>

</html>
