<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 - My REST App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="nav">
        <div class="nav-brand">My REST App</div>
        <div class="nav-links">
            <a href="/index.html" class="nav-link">홈</a>
            <a href="/posts.html" class="nav-link active">게시글</a>
            <a href="/profile.html" class="nav-link">프로필</a>
            <a href="#" id="logoutBtn" class="nav-link">로그아웃</a>
        </div>
    </nav>

    <main class="container">
        <header class="mb-4" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>게시글 목록</h1>
            <a href="/post_form.html" class="btn btn-primary" style="width: auto; padding: 0.6rem 1.5rem;">새 글 작성</a>
        </header>

        <div class="card" style="max-width: none; padding: 1.5rem;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--glass-border);">
                        <th style="padding: 1rem;">번호</th>
                        <th style="padding: 1rem;">제목</th>
                        <th style="padding: 1rem;">작성자</th>
                        <th style="padding: 1rem;">작성일</th>
                        <th style="padding: 1rem;">조회수</th>
                    </tr>
                </thead>
                <tbody id="postList">
                    <!-- 데이터 로딩 중 표시 -->
                    <tr>
                        <td colspan="5" style="padding: 3rem; text-align: center; color: var(--text-muted);">
                            데이터를 불러오고 있습니다...
                        </td>
                    </tr>
                </tbody>
            </table>

            <div id="pagination" style="margin-top: 2rem; display: flex; justify-content: center; gap: 0.5rem;">
                <!-- 페이지네이션 버튼 동적 생성 -->
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/posts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 인증 체크
            if (!api.getTokens().access) {
                location.href = '/login.html';
                return;
            }

            // 로그아웃 연동
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                api.clearAndRedirect();
            });

            // 목록 렌더링
            const renderList = async (page = 0) => {
                const listContainer = document.getElementById('postList');
                const data = await posts.fetchList(page);

                if (!data || !data.posts || data.posts.length === 0) {
                    listContainer.innerHTML = '<tr><td colspan="5" style="padding: 3rem; text-align: center; color: var(--text-muted);">게시글이 없습니다.</td></tr>';
                    return;
                }

                listContainer.innerHTML = data.posts.map(post => `
                    <tr style="border-bottom: 1px solid var(--glass-border); cursor: pointer;" onclick="location.href='/post_detail.html?no=${post.no}'">
                        <td style="padding: 1rem;">${post.no}</td>
                        <td style="padding: 1rem; font-weight: 500;">${post.title}</td>
                        <td style="padding: 1rem;">${post.authorName || '익명'}</td>
                        <td style="padding: 1rem; color: var(--text-muted);">${posts.formatDate(post.createdAt)}</td>
                        <td style="padding: 1rem;">${post.views || 0}</td>
                    </tr>
                `).join('');

                // 간단한 페이지네이션 구현 (UX 향상을 위해)
                const pg = document.getElementById('pagination');
                pg.innerHTML = '';
                for (let i = 0; i < data.totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.innerText = i + 1;
                    btn.className = 'btn';
                    btn.style.width = '40px';
                    btn.style.height = '40px';
                    btn.style.padding = '0';
                    // API의 currentPage는 1부터 시작함. 
                    // i는 0부터 시작하는 루프 인덱스이므로 comparison 수정.
                    const isCurrent = (i + 1 === data.currentPage);
                    btn.style.background = isCurrent ? 'var(--primary)' : 'var(--card-bg)';
                    btn.onclick = () => renderList(i);
                    pg.appendChild(btn);
                }
            };

            await renderList();
        });
    </script>
</body>

</html>
